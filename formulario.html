<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Proyecto</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>

<body>
  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">Formulario</h1>

      <form class="box">

        <!-- Campo de nombre -->
        <div class="field">
          <label class="label" for="nombre">Nombre</label>
          <div class="control">
            <input class="input" type="text" id="nombre" name="nombre">
          </div>
        </div>

        <!-- Campo de teléfono -->
        <div class="field">
          <label class="label" for="telefono">Teléfono</label>
          <div class="control">
            <input class="input" type="text" id="telefono" name="telefono">
          </div>
        </div>

        <!-- Campo de correo -->
        <div class="field">
          <label class="label" for="correo">Correo</label>
          <div class="control">
            <input class="input" type="email" id="correo" name="correo">
          </div>
        </div>

        <!-- Campo de dirección -->
        <div class="field">
          <label class="label" for="direccion">Dirección</label>
          <div class="control">
            <input class="input" type="text" id="direccion" name="direccion">
          </div>
        </div>

        <!-- Botón de envío -->
        <div class="field has-text-centered">
          <button class="button is-primary" type="submit">Enviar</button>
        </div>

      </form>
    </div>
  </section>
</body>
</html>

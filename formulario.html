<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario Proyecto</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

<style>

  .is-valid {
    border-color: #23d160 !important; 
  }
  .is-invalid {
    border-color: #ff3860 !important;
  }
  .help.is-visible {
    color: #ff3860;
    display: block;
  }
  .help {
    display: none;
  }
</style>
</head>

<body>
<section class="section">
  <div class="container">
    <h1 class="title has-text-centered">Formulario</h1>

    <form class="box" id="formulario">

      <div class="field">
        <label class="label" for="nombre">Nombre</label>
        <div class="control">
          <input class="input" type="text" id="nombre" name="nombre" required
            pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,40}"
            title="Solo letras.">
          <p class="help" id="error-nombre">Solo letras</p>
        </div>
      </div>

      <div class="field">
        <label class="label" for="telefono">Teléfono</label>
        <div class="control">
          <input class="input" type="text" id="telefono" name="telefono" required
            pattern="[0-9]{10}"
            title="10 dígitos.">
          <p class="help" id="error-telefono">10 dígitos</p>
        </div>
      </div>

      <div class="field">
        <label class="label" for="correo">Correo</label>
        <div class="control">
          <input class="input" type="email" id="correo" name="correo" required
            pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,}$"
            title="Introduce un correo válido.">
          <p class="help" id="error-correo">Introduce un correo válido (ejemplo@dominio.com).</p>
        </div>
      </div>

      <div class="field">
        <label class="label" for="direccion">Dirección</label>
        <div class="control">
          <input class="input" type="text" id="direccion" name="direccion" required
            pattern="[A-Za-z0-9\s\.,#\-]{5,100}"
            title="Se permiten letras, números, puntos, comas y guiones.">
          <p class="help" id="error-direccion">Se permiten letras, números, puntos, comas y guiones (5 a 100 caracteres).</p>
        </div>
      </div>

      <div class="field">
        <label class="label" for="edad">Edad</label>
        <div class="control">
          <input class="input" type="number" id="edad" name="edad" required
            min="1" max="120"
            pattern="^(?:1?[0-9]{1,2}|120)$"
            title="Ingresa una edad válida.">
          <p class="help" id="error-edad">Ingresa una edad válida.</p>
        </div>
      </div>

      <div class="field">
        <label class="label" for="fecha">Fecha</label>
        <div class="control">
          <input class="input" type="date" id="fecha" name="fecha" required
            pattern="^\d{4}-\d{2}-\d{2}$"
            title="Selecciona una fecha válida (AAAA-MM-DD).">
          <p class="help" id="error-fecha">Selecciona una fecha válida.</p>
        </div>
      </div>

      <div class="field has-text-centered">
        <button class="button is-primary" type="submit">Enviar</button>
      </div>

    </form>
  </div>
</section>

<script>
document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", () => {
    const errorMsg = document.getElementById("error-" + input.id);
    if (input.checkValidity()) {
      errorMsg.classList.remove("is-visible");
      input.classList.add("is-valid");
      input.classList.remove("is-invalid");
    } else {
      errorMsg.classList.add("is-visible");
      input.classList.add("is-invalid");
      input.classList.remove("is-valid");
    }
  });
});

document.getElementById("formulario").addEventListener("submit", e => {
  if (!e.target.checkValidity()) {
    e.preventDefault();
    alert("Por favor, corrige los campos marcados en rojo antes de enviar.");
  }
});
</script>

</body>
</html>
